name: Verify Politics website publication

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify site and offline lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check content-hashed service-worker revision
        run: python scripts/build.py --check
      - name: Validate site links, social metadata, chapters and assets
        run: python tests/verify_publication.py
      - name: Parse standalone navigation and offline JavaScript
        run: |
          node --check reading-position.js
          node --check summary-visibility.js
          node --check navigation.js
          node --check search.js
          node --check offline.js
          node --check service-worker.js
      - name: Test summary visibility preference, deep links and printing
        run: node tests/test_summary_visibility.mjs
      - name: Test full-text search and sidebar tabs
        run: node tests/test_full_text_search.mjs
      - name: Test durable reading checkpoints and edition migration
        run: node tests/test_reading_position.mjs
      - name: Simulate cached reopening and interrupted updates
        run: node tests/test_service_worker.mjs
      - name: Install headless Chromium browser tests
        run: |
          python -m pip install --disable-pip-version-check playwright pypdf
          python -m playwright install --with-deps chromium
      - name: Verify search UI and print with backgrounds disabled (Chromium)
        run: python tests/test_browser_batch_a.py
