name: Verify Politics website publication

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify site and offline lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check content-hashed service-worker revision
        run: python scripts/build.py --check
      - name: Validate site links, social metadata, chapters and assets
        run: python tests/verify_publication.py
      - name: Parse standalone navigation and offline JavaScript
        run: |
          node --check assets/js/reading-position.js
          node --check assets/js/study-material-visibility.js
          node --check assets/js/navigation.js
          node --check assets/js/search.js
          node --check assets/js/offline.js
          node --check service-worker.js
      - name: Test study-material visibility, deep links and print
        run: node tests/unit/test_study_material_visibility.mjs
      - name: Test full-text search and sidebar tabs
        run: node tests/unit/test_search.mjs
      - name: Ensure academic source integrity and reader code consolidation
        run: node tests/unit/test_consolidation.mjs
      - name: Test durable reading checkpoints and edition migration
        run: node tests/unit/test_reading_position.mjs
      - name: Simulate cached reopening and interrupted updates
        run: node tests/unit/test_service_worker.mjs
      - name: Regression — optional offline assets must not block reader
        run: node tests/unit/test_optional_precache.mjs
      - name: Install headless Chromium browser tests
        run: |
          python -m pip install --disable-pip-version-check playwright pypdf
          python -m playwright install --with-deps chromium
      - name: Verify search UI and print with backgrounds disabled (Chromium)
        run: python tests/browser/test_search_print.py
      - name: Verify mobile layout, accessibility and reduced motion (Chromium)
        run: python tests/browser/test_mobile_accessibility.py
      - name: Verify saved reading through browser restarts and installed editions (Chromium)
        run: python tests/browser/test_reading_offline.py
      - name: Capture cross-viewport UI screenshots and print proofs (Chromium)
        run: python tests/browser/test_visual_regression.py
      - name: Upload cross-viewport and print evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: politics-reader-visual-regression
          path: artifacts/politics-visual-regression/
          if-no-files-found: warn
          retention-days: 14
